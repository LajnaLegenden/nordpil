# Formatting, lints, unit tests and the Docker integration tests, on the
# commit being checked, optionally with the version bumped first. CI runs it
# on pull requests; the Release and Publish workflows run it before building.
name: Check

on:
  workflow_call:
    inputs:
      version:
        description: Bump to this version before checking; empty checks the tree as it is.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-
      - if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/bump-version.sh "$VERSION"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The tests marked "needs Docker": MongoDB 8.0 through testcontainers.
      - run: cargo test --workspace --locked -- --ignored
