# Builds nordpil for macOS and Linux and publishes a GitHub Release.
#
# Run it from the Actions tab with the new version. Checks and every build
# run on the bumped version first; only when all of them pass does the
# release job commit the bump to main, tag it and publish the release. With
# "dry run" checked the files are only kept as workflow artifacts.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.2.0 or 0.2.0-beta.1
        required: true
        type: string
      dry_run:
        description: Dry run (build the files only; no commit, tag or release)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the run can release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME. Run it on main or as a dry run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already tagged."
            exit 1
          fi
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-
      - run: scripts/bump-version.sh "$VERSION"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deb
            target
          key: linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-
      - name: Install cargo-deb
        run: command -v cargo-deb >/dev/null || cargo install cargo-deb --locked --version 3.8.0
      - run: scripts/bump-version.sh "$VERSION"
      - run: cargo build --release --locked -p nordpil
      - run: scripts/package-linux.sh "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          # Built on Apple Silicon too; GitHub is retiring its Intel runners.
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-15
    env:
      # Matches LSMinimumSystemVersion in crates/app/assets/macos/Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ matrix.arch }}-
      - run: scripts/bump-version.sh "$VERSION"
      - run: cargo build --release --locked -p nordpil --target ${{ matrix.target }}
      - run: scripts/package-macos.sh "$VERSION" ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [check, linux, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check main is still where the builds started
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main moved since this run started. Run the release again."
            exit 1
          fi
      - run: scripts/bump-version.sh "$VERSION"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "nordpil $VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(sed "s/@VERSION@/$VERSION/g" .github/release-notes.md)"
          prerelease=()
          if [[ $VERSION == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "v$VERSION" dist/* \
            --title "nordpil $VERSION" \
            --verify-tag \
            --generate-notes \
            --notes "$notes" \
            "${prerelease[@]}"
