# Starts a release: run it from the Actions tab and pick the bump. The new
# version comes from scripts/next-version.sh and the version in Cargo.toml;
# a pre-release tag such as beta or rc makes it a pre-release, e.g. 0.3.0-beta.1.
#
# Checks and every build run on the bumped version first. Only when all of
# them pass does it push the bump to a release/v<version> branch and open a
# pull request for it; main is protected, so nothing lands there directly.
# Rebase-merging that PR starts the Publish workflow, which builds again from
# main, tags the commit and publishes the GitHub Release.
#
# With "dry run" checked the files are only kept as workflow artifacts, one
# per file and named after it, e.g. nordpil-0.2.0-linux-x86_64.deb.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump (prerelease continues the current pre-release, e.g. beta.1 -> beta.2)
        required: true
        type: choice
        options: [patch, minor, major, prerelease]
      tag:
        description: Pre-release tag, e.g. beta or rc (empty for a full release)
        type: string
        default: ""
      dry_run:
        description: Dry run (build the files only; no pull request)
        type: boolean
        default: true

run-name: Release ${{ inputs.bump }}${{ inputs.tag != '' && format(' ({0})', inputs.tag) || '' }}${{ inputs.dry_run && ', dry run' || '' }}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Can release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ inputs.tag }}
        run: |
          version="$(scripts/next-version.sh "$BUMP" "$TAG")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Releasing **v$version**" >>"$GITHUB_STEP_SUMMARY"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF_NAME. Run it on main or as a dry run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already tagged."
            exit 1
          fi
          if [ "$DRY_RUN" != true ] &&
            git ls-remote --exit-code --heads origin "refs/heads/release/v$VERSION" >/dev/null; then
            echo "::error::The branch release/v$VERSION already exists. Merge or close its pull request and delete the branch first."
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is missing, so installed apps couldn't update to this release."
            exit 1
          fi

  check:
    needs: guard
    uses: ./.github/workflows/check.yml
    with:
      version: ${{ needs.guard.outputs.version }}

  build:
    needs: [guard, check]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      bump: true

  propose:
    name: Open the release PR
    needs: [guard, check, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - run: scripts/bump-version.sh "$VERSION"
      - name: Push the bump to release/v${{ needs.guard.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git push origin "HEAD:refs/heads/release/v$VERSION"
      # This tree is exactly what the check job passed on, and a PR opened
      # with GITHUB_TOKEN starts no CI run of its own.
      - name: Mark the check as passed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context="CI / Check" \
            -f description="Passed in the Release workflow" \
            -f target_url="$RUN_URL"
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "release/v$VERSION" \
            --title "chore: release v$VERSION" \
            --body "Bumps the version to $VERSION. Checks and builds passed in the Release workflow. Rebase-merge this to publish the release: the Publish workflow builds from main, tags the commit and publishes it."
