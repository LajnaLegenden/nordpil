[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
nordpil-backend = { path = "crates/backend" }
nordpil-query = { path = "crates/query" }
nordpil-shell = { path = "crates/shell" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
