[package]
name = "nordpil"
description = "A lightweight, native MongoDB GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bson = "3.1"
crossbeam-channel = "0.5.17"
directories = "6"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.37", default-features = false }
nordpil-backend.workspace = true
nordpil-query.workspace = true
nordpil-shell.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = "1"

[package.metadata.deb]
maintainer = "Linus Jansson <00jansson@gmail.com>"
copyright = "Linus Jansson"
extended-description = "A lightweight, native MongoDB GUI: browse, query, edit and script MongoDB databases."
section = "database"
# The GUI libraries are loaded at run time, so $auto can't see them.
depends = "$auto, libegl1, libgl1, libxkbcommon0"
recommends = "libwayland-client0, libwayland-egl1, libxkbcommon-x11-0, libx11-6, libxcursor1, libxi6, libxrandr2, xdg-desktop-portal"
assets = [
    ["target/release/nordpil", "usr/bin/", "755"],
    ["assets/nordpil.desktop", "usr/share/applications/", "644"],
    ["assets/nordpil.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/nordpil/README.md", "644"],
]

[features]
# Lets tests render the UI to PNG files (pulls in wgpu). See `just screenshots`.
screenshots = ["egui_kittest/wgpu"]

[lints]
workspace = true

[dev-dependencies]
nordpil-backend = { workspace = true, features = ["test-support"] }
egui_kittest = "0.37"
testcontainers-modules = { version = "0.15", features = ["mongo", "blocking"] }
