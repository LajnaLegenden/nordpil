[package]
name = "nordpil-backend"
description = "Database access and background runtime for nordpil"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# MONGODB-AWS credentials. The driver enables aws-config without SSO and
# credential_process; most people sign in to AWS through one of those.
aws-config = { version = "1", default-features = false, features = [
    "credentials-process",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-credential-types = { version = "1.2.4", default-features = false }
aws-runtime = { version = "1.10.4", default-features = false }
bson = { version = "3.1", features = ["serde_json-1"] }
crossbeam-channel = "0.5.17"
csv = "1.4"
directories = "6"
futures-util = "0.3.34"
keyring = "4.2"
mongodb = { version = "3.9", default-features = false, features = [
    "aws-auth",
    "bson-3",
    "compat-3-3-0",
    "dns-resolver",
    "rustls-tls",
] }
nordpil-query.workspace = true
nordpil-shell.workspace = true
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "process",
    "io-util",
] }
tokio-util = "0.7.20"
toml = "1.1"
tracing = "0.1.44"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[features]
# Test helpers for other crates' tests, e.g. an in-memory secret store.
test-support = []

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12"
nordpil-backend = { path = ".", features = ["test-support"] }
nordpil-shell.workspace = true
testcontainers-modules = { version = "0.15", features = ["mongo"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
